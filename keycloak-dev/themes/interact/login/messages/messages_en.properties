# Static hint list shown on the update-password page (login-update-password.ftl).
# Keep in sync with the realm's passwordPolicy in interact-realm.json.
passwordRequirementsTitle=Your password must meet these requirements\:
passwordRequirementMinLength=At least 12 characters
passwordRequirementCase=At least one uppercase and one lowercase letter
passwordRequirementDigit=At least one digit
passwordRequirementSpecialChar=At least one special character
passwordRequirementNotUsername=Must not be the same as your username
passwordRequirementHistory=Must not match any of your last 3 passwords

# Shown for a wrong password AND for a locked account: Keycloak deliberately
# gives both the same message (so attackers cannot tell which usernames
# exist), and a theme cannot tell them apart. The text must therefore be true
# in both cases. Keep the numbers in sync with failureFactor (5) and
# waitIncrementSeconds (60, rising to maxFailureWaitSeconds 900) in
# interact-realm.json. Avoid apostrophes: Keycloak runs these through
# MessageFormat, where a single quote is an escape character.
invalidUserMessage=Invalid username or password. After 5 wrong attempts your account is locked temporarily. If that happens, wait about a minute (longer after repeated failures) and try again.
invalidUsernameMessage=Invalid username or password. After 5 wrong attempts your account is locked temporarily. If that happens, wait about a minute (longer after repeated failures) and try again.
invalidPasswordMessage=Invalid username or password. After 5 wrong attempts your account is locked temporarily. If that happens, wait about a minute (longer after repeated failures) and try again.
accountTemporarilyDisabledMessage=Your account is locked because of too many wrong passwords. Wait about a minute (longer after repeated failures) and try again.
