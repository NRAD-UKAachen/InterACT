# InterACT login theme.
#
# Mostly a CSS-only child of the stock "keycloak" theme: nearly every .ftl
# template is inherited, so a Keycloak upgrade cannot break this theme the
# way a copied template would. All the styling lives in
# resources/css/interact.css.
#
# The one deliberate exception is login-update-password.ftl, copied from the
# base theme to add a password-requirements hint list (Keycloak has no
# built-in way to surface the realm's passwordPolicy on that page). Its
# strings are static, in messages/messages_en.properties -- keep them in
# sync with passwordPolicy in interact-realm.json, and re-diff the template
# against the base theme's copy after a Keycloak upgrade.
#
# "styles" replaces (not extends) the parent's value, so the parent's
# css/login.css has to be listed again before ours -- interact.css is only a
# set of overrides on top of it. "stylesCommon" (PatternFly) is inherited
# untouched.
parent=keycloak
import=common/keycloak

styles=css/login.css css/interact.css

# Cosmetic 60 s lock after 5 failed tries (see the script header).
# Remove this line to switch it off.
scripts=js/login-lock.js
