# TLS terminator for the INTERACT GUI.
#
# The GUI, Keycloak and the DICOM services all currently speak plain HTTP, so
# patient imaging and Keycloak bearer tokens cross the network in the clear.
# Put this in front of the GUI (same pattern as keycloak-dev/nginx.conf, which
# already terminates TLS for Keycloak) and set BEHIND_TLS_PROXY=1 on the GUI
# container so Flask honours X-Forwarded-Proto.
#
#   docker run -d --name interact-gui-tls \
#     -p 443:443 \
#     -v $PWD/nginx-tls.conf:/etc/nginx/nginx.conf:ro \
#     -v /etc/ssl/interact:/etc/nginx/ssl:ro \
#     --network ${STACK_NAME:-interact}-dcm4chee nginx:alpine
#
# After this is live, update in Keycloak and the GUI env:
#   - redirectUris / webOrigins  -> https://YOUR_PUBLIC_HOST/...
#   - OIDC_CANONICAL_REDIRECT_URI, OIDC_ALLOWED_HOSTS
#   - COOKIES_INSECURE=0 (the default)
#   - realm "sslRequired": "all"

worker_processes 1;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;

  # DICOM series uploads and cohort folder-drops are large.
  client_max_body_size 0;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  # Plain HTTP exists only to bounce callers to HTTPS.
  server {
    listen 80;
    server_name YOUR_PUBLIC_HOST;   # match PUBLIC_HOST in the root .env
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_PUBLIC_HOST;   # match PUBLIC_HOST in the root .env

    ssl_certificate     /etc/nginx/ssl/interact.crt;
    ssl_certificate_key /etc/nginx/ssl/interact.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Tell browsers never to try this host over plain HTTP again.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
      # Compose service name (from docker-context-gui/docker-compose.yml),
      # not the container name -- it resolves the same regardless of
      # STACK_NAME.
      proxy_pass http://interact-gui:5000;
      proxy_http_version 1.1;

      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  443;

      # NiiVue/OHIF stream large volumes; don't buffer them into memory.
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
